# Nightly real-mission dogfood (issue #226).
#
# Runs two REAL missions (a docs-only change and a one-function change with a
# test) through EngineeringRuntime against the real InferWeave gateway, on a
# fresh green fixture repo each, and records the outcome as roadmap evidence
# (`dogfood_mission`, docs/roadmap/dogfood/<sha>.json). `roadmap check` (the
# release gate, not --structural) demotes any VERIFIED milestone without such a
# record at or after its latest scope change to IMPLEMENTED.
#
# Nothing queues until an operator opts in. Operator steps:
#   1. Register a self-hosted runner that can reach the gateway, with the labels
#      `self-hosted` and `inferweave` (Settings > Actions > Runners).
#   2. Add repository secrets DOGFOOD_GATEWAY_BASE_URL (OpenAI-compatible URL
#      ending in /v1) and DOGFOOD_GATEWAY_API_KEY.
#   3. Add repository variable DOGFOOD_MODEL (e.g.
#      metabolomics/qwen3.8-27b-modality-text-quant-mxfp4).
#   4. Optional: add secret DOGFOOD_PR_TOKEN (a PAT or GitHub App token). PRs
#      opened with the default token do not trigger pull_request CI; with this
#      secret they do. Without it, close and reopen the evidence PR to run CI,
#      and enable "Allow GitHub Actions to create and approve pull requests"
#      (Settings > Actions > General).
#   5. Add repository variable DOGFOOD_RUNNER_READY=true. Until it is set the job
#      is skipped; unset or set it to anything else to pause the nightly run.
# On success the job opens a PR with the record (it never pushes to main). See
# docs/usage.md "Nightly real-mission dogfood".

name: Nightly dogfood

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-dogfood
  cancel-in-progress: false

jobs:
  dogfood:
    if: vars.DOGFOOD_RUNNER_READY == 'true'
    runs-on: [self-hosted, inferweave]
    # Two missions at 30 minutes each, plus install and PR overhead.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the SHA under test
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run real missions
        env:
          PI_DOGFOOD_GATEWAY_BASE_URL: ${{ secrets.DOGFOOD_GATEWAY_BASE_URL }}
          PI_DOGFOOD_GATEWAY_API_KEY: ${{ secrets.DOGFOOD_GATEWAY_API_KEY }}
          PI_DOGFOOD_MODEL: ${{ vars.DOGFOOD_MODEL }}
        run: node scripts/dogfood-real-mission.ts --out "dogfood/${{ steps.pin.outputs.sha }}.json" --timeout-ms 1800000
      - name: Upload record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-mission-${{ steps.pin.outputs.sha }}
          path: dogfood/${{ steps.pin.outputs.sha }}.json
          if-no-files-found: ignore
      - name: Open a PR with the roadmap evidence record
        # Reached only when both missions reached COMPLETE (the script exits 0).
        env:
          GH_TOKEN: ${{ secrets.DOGFOOD_PR_TOKEN || github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          short="${SHA::12}"
          branch="dogfood/${short}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p docs/roadmap/dogfood
          cp "dogfood/${SHA}.json" "docs/roadmap/dogfood/${SHA}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "docs/roadmap/dogfood/${SHA}.json"
          git commit -m "chore(roadmap): dogfood_mission evidence for ${short}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}"
          GH_REPO="${GITHUB_REPOSITORY}" gh pr create --base main --head "${branch}" \
            --title "chore(roadmap): dogfood_mission evidence for ${short}" \
            --body "Nightly real-mission dogfood: both missions reached COMPLETE at ${SHA}. Record: docs/roadmap/dogfood/${SHA}.json (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
