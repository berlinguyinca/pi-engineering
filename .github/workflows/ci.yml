# Continuous integration for pi-engineering-runtime.
#
# Spec (docs/specs/pi-engineering-verifiable-roadmap-completion-spec.md §20):
# CI SHOULD run npm test, npm run typecheck, and npm run roadmap:check.
# On a release candidate, roadmap:check MUST pass (all required milestones
# VERIFIED, evidence fresh, no unresolved critical/high findings, dogfood
# evidence present). `roadmap check` regenerates the deterministic evidence
# store (gitignored) at the checked-out commit and reads the committed manual
# index (docs/roadmap/evidence.yaml), so a complete commit passes here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: viking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/viking_test
      VIKING_TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/viking_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so evidence freshness (changedPathsSince) can diff
          # against the recorded evidence commit rather than treating a
          # shallow clone as stale.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install memory service dependencies
        run: |
          npm ci --prefix services/openviking
          npm ci --prefix services/viking-portal
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Package-load + command smoke
        run: npm run test:e2e
      - name: Verifiable roadmap check (exit 0 = complete)
        run: npm run roadmap:check
