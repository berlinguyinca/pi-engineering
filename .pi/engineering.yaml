# Repo-level engineering policy — per-role model placement (the standing decision).
#
# Layered: built-in defaults < global (~/.pi/agent/engineering.yaml) < this
# file < env:PI_ENGINEERING_POLICY. Routing runs in `auto` mode, so these pins
# are preferences: when a pinned model is present and healthy it wins over
# scoring; when it is unavailable the router degrades to the best available
# candidate (see RoleRouter.select — "Overrides win over ranking"). Core keeps
# working on a host without these models.
#
# Why explicit placement: the orchestrator/mission worker roles are now routed
# through the capability router (PR #46). Left to pure auto scoring the platform
# selects `deepseek_v4-flash-…-mxfp4` as "best implementer", but that model
# loops (no progress) on substantial turns and exhausts the worker budget
# without committing. The APS work (src/aps) exists precisely to detect such
# loops; prevention is to not route roles onto them.
#
# Placement uses three DISTINCT qwen models so plan/implement/review are
# genuinely independent (separation-of-duties), and image review is vision:
#   planner     -> qwen3.8-flash_next (fast, distinct)
#   implementer -> qwen3.8-27b text   (capable)
#   reviewer    -> qwen3.8-27b vision (distinct from implementer; can read UI)
#   vision      -> qwen3.8-27b vision
routing:
  mode: auto
  roles:
    # NOTE (rev 3, 2026-10-04): rev 2 pinned text roles to local `gpu-host-1`
    # (llama.cpp) and `gpu-host-2` (ollama), written when the remote metabolomics
    # gateway served only vision models. In a default fresh process those local
    # providers are NOT reachable, so planner/implementer/reviewer degraded to
    # the auto-scored `deepseek_v4-flash-…-mxfp4`, which loops on substantial
    # turns (the exact failure APS exists to catch). The metabolomics gateway
    # now serves the text lineup again, so pin the text roles back to it — three
    # DISTINCT qwen models (separation-of-duties), implementer on text 262k,
    # reviewer on vision (≠ implementer, ≠ session), verifier on vision q4
    # (≠ implementer, ≠ reviewer).
    # NOTE (rev 5, P2 — gateway-owned route names): the text/vision roles now
    # pin LOGICAL route IDs owned by the inferweave edge instead of concrete
    # model IDs. A route name never flaps: endpoint churn is absorbed by the
    # gateway's own fallback machinery (route-generation bump + MODEL_FALLBACK)
    # instead of the client discovering "model not served" 30 minutes into a
    # task. Until the edge serves the routes (gateway change G1, not yet
    # deployed), each pin carries fallback_model — the concrete model the role
    # ran on before rev 5 — so today's placement is unchanged and the route
    # takes over the moment it is discovered. An explicit operator pin never
    # falls back (it degrades to scoring instead).
    #   planner       -> route coding-planning        (fallback: qwen3.8-flash_next text q4)
    #   implementer   -> route coding-implementation  (fallback: qwen3.8-flash_next text q4 —
    #                     see the rev 4 note: the 27b text q8 endpoint flaps)
    #   reviewer      -> route coding-review          (fallback: qwen3.8-27b vision q8)
    #   verifier      -> metabolomics qwen3.8-27b vision q4 (≠ implementer, ≠ reviewer)
    #   spec_verifier -> metabolomics qwen3.8-27b vision q4 (≠ reviewer)
    #   test_reviewer -> metabolomics qwen3.8-27b vision q4
    # NOTE (rev 6, 2026-10-18 — gateway roster reality check): G1 routes are
    # still undeployed, and the rev-5 fallback (qwen3.8-flash_next text q4) is
    # advertised in the gateway's /v1/models but 404s (model_not_found) on
    # completion — a stale list that does NOT trip the UnavailableModels
    # exclusion, so planner/implementer busy-wait instead of degrading.
    # Verified served on 2026-10-18: deepseek_v4-flash (text, 200 OK),
    # qwen3.8-27b vision q8 + ctx-c120k q4 (200 OK). Point the text-role
    # fallbacks at deepseek_v4-flash until G1 lands or qwen3.8-flash_next is
    # actually served; reviewer/verifier pins unchanged (verified served).
    # Ledger: FINDING-QAyyZh (stale /models + no degradation),
    # FINDING-GIbklY (APS escalation to unserved model).
    # NOTE (rev 7, 2026-10-18 — P0 unblock, live-verified): rev 6 routed the
    # text roles to deepseek_v4-flash because qwen3.8-flash_next was believed
    # unserved. Re-verified against the live gateway (http://100.104.39.6:8290
    # /v1, Bearer from models.json apiKey) on 2026-10-18:
    #   - qwen3.8-27b (alias) -> resolves to qwen3.8-27b-modality-vision-quant-q8_k_xl
    #     and IS served: 200 OK, produces correct usable tool-callable text
    #     output (27b, 131k context). This is the only strong text-capable model
    #     actually served on the gateway today.
    #   - qwen3.8-flash_next-modality-text-quant-q4_k_xl -> 404 model_not_found
    #     (confirms FINDING-QAyyZh stale /models list).
    #   - deepseek_v4-flash-modality-text-quant-mxfp4 -> 200 OK but TOO WEAK:
    #     on the disk-pressure P0 it read-thrashes (>=40 non-mutating actions,
    #     no write/edit) and is loop_prevented via no_mutation_stall, so the
    #     implementer never publishes a candidate. That dead-ends the gate.
    # Action: pin planner + implementer to the strong 27b model (explicit pin,
    # so it does not degrade to scoring). It shares the reviewer model (both
    # qwen3.8-27b vision q8) because no DISTINCT strong text model is served —
    # a documented separation-of-duties tradeoff to unblock the P0 with a model
    # strong enough to actually write code. Revert to distinct text pins once G1
    # routes land or a strong text model is served.
    planner:
      model: "metabolomics/deepseek_v4-flash-modality-text-quant-mxfp4"
      fallback_model: "metabolomics/qwen3.8-flash_next-modality-text-quant-q4_k_xl"
      timeout_ms: 3600000
      max_context_tokens: 128000
    implementer:
      model: "metabolomics/deepseek_v4-flash-modality-text-quant-mxfp4"
      fallback_model: "metabolomics/qwen3.8-flash_next-modality-text-quant-q4_k_xl"
      timeout_ms: 3600000
      max_context_tokens: 128000
    reviewer:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q8_k_xl"
      fallback_model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
      timeout_ms: 1800000
      max_context_tokens: 128000
    verifier:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
      fallback_model: "metabolomics/deepseek_v4-flash-modality-text-quant-mxfp4"
    spec_verifier:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
      fallback_model: "metabolomics/deepseek_v4-flash-modality-text-quant-mxfp4"
    test_reviewer:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
      fallback_model: "metabolomics/deepseek_v4-flash-modality-text-quant-mxfp4"
    # rev 8 (2026-10-25, operator directive): text roles -> deepseek_v4-flash.
    # Live probe today: development-gateway qwen3.8-27b family ALL 404
    # (dispatch-killed MSN-D1xaBT and MSN-J9sycT); metabolomics
    # deepseek_v4-flash 200, 27b-vision-q8 200, flash_next-q4_k_xl 200,
    # 27b-vision-q4 429 (served, backpressured), coding-review 404. Review
    # moves to the served 27b-vision-q8 — a family DISTINCT from the deepseek
    # implementer, so the cross-family independent-review separation of duties
    # holds. The rev-7 warning stands: on one P0 deepseek read-thrashed to
    # loop_prevented (no_mutation_stall); if the implementer stalls the same
    # way, the operator flips the pin (or /model) to flint/flint-40b — also
    # served — and resumes. Backup: engineering.yaml.bak-20261025-point-at-deepseek.
