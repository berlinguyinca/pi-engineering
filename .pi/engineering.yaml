# Repo-level engineering policy — per-role model placement (the standing decision).
#
# Layered: built-in defaults < global (~/.pi/agent/engineering.yaml) < this
# file < env:PI_ENGINEERING_POLICY. Routing runs in `auto` mode, so these pins
# are preferences: when a pinned model is present and healthy it wins over
# scoring; when it is unavailable the router degrades to the best available
# candidate (see RoleRouter.select — "Overrides win over ranking"). Core keeps
# working on a host without these models.
#
# Why explicit placement: the orchestrator/mission worker roles are now routed
# through the capability router (PR #46). Left to pure auto scoring the platform
# selects `deepseek_v4-flash-…-mxfp4` as "best implementer", but that model
# loops (no progress) on substantial turns and exhausts the worker budget
# without committing. The APS work (src/aps) exists precisely to detect such
# loops; prevention is to not route roles onto them.
#
# Placement uses three DISTINCT qwen models so plan/implement/review are
# genuinely independent (separation-of-duties), and image review is vision:
#   planner     -> qwen3.8-flash_next (fast, distinct)
#   implementer -> qwen3.8-27b text   (capable)
#   reviewer    -> qwen3.8-27b vision (distinct from implementer; can read UI)
#   vision      -> qwen3.8-27b vision
routing:
  mode: auto
  roles:
    # NOTE (2026-09-30, rev 2): the remote metabolomics gateway serves only
    # the two 27b vision models (flash_next and the text lineup are gone), and
    # the global agent policy pins every role to one q8 model — which the
    # default separation-of-duties pairs (implementer≠reviewer,
    # implementer≠verifier, reviewer≠spec_verifier, plus reviewer≠session
    # requester) reject, pushing the router onto the scored fallback
    # flash_next (marked healthy in the capability cache but actually at zero
    # capacity: 503 inferweave_backpressure, observed MSN-NlD53D). So pin ALL
    # roles here (repo layer overrides global) to models verified served, in an
    # assignment that satisfies every distinct-pair AND keeps the reviewer off
    # the driver session's model (metabolomics q8):
    #   planner       -> beast local llama.cpp 27b q4 (distinct, low latency)
    #   implementer   -> beast local llama.cpp 27b q4 (≠ reviewer, ≠ verifier)
    #   reviewer      -> bender local ollama 27b vision q4 (vision; ≠ implementer, ≠ session)
    #   verifier      -> metabolomics remote 27b vision q4 (≠ implementer, ≠ session)
    #   spec_verifier -> metabolomics remote 27b vision q4 (≠ reviewer)
    #   test_reviewer -> metabolomics remote 27b vision q4
    planner:
      model: "beast/qwen3.8-27b-q4"
      timeout_ms: 3600000
      max_context_tokens: 128000
    implementer:
      model: "beast/qwen3.8-27b-q4"
      timeout_ms: 3600000
      max_context_tokens: 256000
    reviewer:
      model: "bender/qwen3.8-27b-modality-vision-quant-q4_k_m"
      timeout_ms: 1800000
      max_context_tokens: 128000
    verifier:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
    spec_verifier:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
    test_reviewer:
      model: "metabolomics/qwen3.8-27b-modality-vision-quant-q4_k_m"
