# Review and merge these locations into the EXISTING TLS viking server block.
# Keep its TLS configuration, /metrics, /health, ACME, and old upstream intact.
# This fragment is not a standalone nginx configuration.

location = /health { proxy_pass http://127.0.0.1:8090; }
location = /metrics { proxy_pass http://127.0.0.1:8090; }
location = /portal-health { proxy_pass http://127.0.0.1:8091/health; }

# OAuth codes appear in callback query strings: do not log this location.
location = /auth/callback {
    access_log off;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}
