# Woodpecker CI -- the release gate (full `npm run roadmap:check`).
#
# Ported from the removed Actions `release-gate` job (spec §20). That job ran
# on release/* tag pushes AND workflow_dispatch; only the tag trigger exists
# here: a `manual` trigger would also fire on every manual run of the
# repo (ci.yaml's too), so manual release-gate runs are not supported. Same checkout,
# toolchain and install as ci.yaml (keep them in step).
when:
  - event: tag
    ref: refs/tags/release/**
    # Unproven on this server; if it never matches, try `refs/tags/release/*`.

skip_clone: true

# Same hive pool as the other repos' gates.
labels:
  cluster: hive

# Each step gets a clean environment AND its own HOME, so the Playwright
# browser cache must live at an explicit shared path or the install step's
# download is invisible to the test steps.
variables:
  - &browsers /tmp/woodpecker-cache/playwright
  # The ONE place the venv path is computed and checked; every step that
  # touches the venv (create, PATH, cleanup) includes it by alias. The path
  # is owned by this pipeline: a distinctive prefix, plus repo and pipeline
  # number, so no other repo's pipeline can produce or collide with it.
  # Written with plain $VAR on purpose: Woodpecker substitutes braced variable
  # references in the YAML text before parsing and would blank any it does
  # not know.
  - &venv_resolve |
    VENV_PREFIX=/tmp/woodpecker-cache/pe-venv-
    case "$CI_REPO" in ''|*[!A-Za-z0-9._/-]*) echo "refusing: CI_REPO empty or unexpected: '$CI_REPO'" >&2; exit 1;; esac
    case "$CI_PIPELINE_NUMBER" in ''|*[!0-9]*) echo "refusing: CI_PIPELINE_NUMBER empty or not a number: '$CI_PIPELINE_NUMBER'" >&2; exit 1;; esac
    VENV="$VENV_PREFIX$(printf '%s' "$CI_REPO" | tr / _)-$CI_PIPELINE_NUMBER"
    case "$VENV" in "$VENV_PREFIX"?*) ;; *) echo "refusing: '$VENV' is outside $VENV_PREFIX" >&2; exit 1;; esac
    if [ -L "$VENV" ]; then echo "refusing: $VENV is a symlink" >&2; exit 1; fi
  # Diagnostic, never fatal: how the staged credential actually reaches git.
  # The checkout has always relied on the host's system git config wiring
  # /etc/woodpecker-git-credentials in, and never verified it — so a host change
  # shows up as an authentication error in a step that never mentions the
  # credential. Before asserting anything about that wiring, record what it is.
  #
  # Everything printed goes through `redact`, and it has to: a git config KEY can
  # carry a secret, because an insteadOf rewrite is keyed by its URL —
  # `url.https://<token>@github.com/.insteadOf` — so printing keys "safely" still
  # prints the token. Same for a helper whose value embeds a password.
  - &cred_probe |
    echo "credential wiring (diagnostic)"
    redact() {
      sed -E -e 's#://[^/@[:space:]]*@#://<redacted>@#g' \
             -e 's#(password|passwd|token|apikey|api_key|pat)=[^&[:space:]]*#\1=<redacted>#gI'
    }
    # Capture, then branch. `git config … | sed …` exits with sed's status, so a
    # pipeline fallback would never fire on an empty result and silence would be
    # indistinguishable from "no helper".
    helper=$(git config --show-origin --get-all credential.helper 2>/dev/null || true)
    if [ -n "$helper" ]; then printf '%s\n' "$helper" | redact | sed 's/^/  helper: /'; else echo "  helper: none configured anywhere"; fi
    rewrites=$(git config --get-regexp '^url\..*\.insteadof' 2>/dev/null | cut -d' ' -f1 || true)
    if [ -n "$rewrites" ]; then printf '%s\n' "$rewrites" | redact | sed 's/^/  rewrite: /'; else echo "  rewrite: none"; fi
    for f in /etc/gitconfig "$HOME/.gitconfig" "$HOME/.git-credentials" "$HOME/.netrc" /etc/woodpecker-git-credentials; do
      if [ -e "$f" ]; then echo "  present: $f"; else echo "  absent:  $f"; fi
    done
    if [ -n "${GIT_ASKPASS:-}" ]; then
      # The agent's helper is deliberately NOT readable by the step: the first run that
      # looked reported `set but not readable`, and a check that demanded -r or -x would
      # fail a healthy checkout. So only its presence is asserted, and readability is
      # reported rather than required.
      echo "  askpass: set, not readable by this step (expected)"
    else
      echo "  askpass: unset"
    fi
    echo "  GIT_ASKPASS=${GIT_ASKPASS:+set} GITHUB_TOKEN=${GITHUB_TOKEN:+set} GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL:-unset}"

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      # What authenticates this checkout was measured on the agent, not assumed:
      # GIT_ASKPASS, pointing at a helper Woodpecker stages per pipeline. There is
      # no credential.helper anywhere and no url.*.insteadOf rewrite, and
      # /etc/gitconfig — though present — is not involved. The comment here used to
      # claim the host's system git config wired /etc/woodpecker-git-credentials in;
      # that is not what the machine does, and it was stated as fact.
      #
      # So require *a* mechanism rather than this one. An agent that changes
      # mechanism should keep building; only the absence of any way to authenticate
      # is fatal, and that is the case that used to surface as an opaque auth error
      # in a step that never mentioned credentials.
      #
      # Presence only, never -x or -r: the first version of this line tested
      # `[ -x "$GIT_ASKPASS" ]`, and on the agent the helper is set but not readable by
      # the step, so a healthy checkout exited 1 here in one second with no step logs —
      # which reads as a broken agent, not as a wrong precondition.
      # The staged file the askpass helper reads. Kept as a check of its own: the
      # helper can be present and the credential it serves be missing.
      - 'echo "DIAG askpass_colon_plus=[${GIT_ASKPASS:+SET}]"'
      - 'echo "DIAG askpass_plus=[${GIT_ASKPASS+SET}]"'
      - 'echo "DIAG askpass_len=[${#GIT_ASKPASS}]"'
      - 'echo "DIAG askpass_dashdash=[${GIT_ASKPASS:-EMPTYDEFAULT}]"'
      - 'if [ -n "${GIT_ASKPASS:-}" ]; then echo "DIAG bracket_test=nonempty"; else echo "DIAG bracket_test=empty"; fi'
      - 'if [ "${GIT_ASKPASS:+set}" = "set" ]; then echo "DIAG colonplus_test=set"; else echo "DIAG colonplus_test=notset"; fi'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential file" >&2; exit 1; }'
      - *cred_probe
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      # Full history, all branches and tags, as the Actions job had
      # (fetch-depth: 0): roadmap evidence freshness diffs against the
      # recorded evidence commit (changedPathsSince) and a shallow clone
      # would read as stale. The commit itself is fetched by SHA too, since a
      # PR head is not on any branch.
      - 'git fetch --tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "$CI_COMMIT_SHA"'
      # NOT `FETCH_HEAD`: after a multi-ref fetch it is the first ref
      # fetched, not the commit. Check out the SHA and prove it (also right
      # for tag events).
      - 'git checkout -q --detach "$CI_COMMIT_SHA"'
      - 'test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA" || { echo "checked out $(git rev-parse HEAD), expected $CI_COMMIT_SHA" >&2; exit 1; }'
      - 'git --no-pager log --oneline -1'

  - name: toolchain
    image: bash
    commands:
      - 'set -eu'
      - 'for t in node npm git make python3 bash; do command -v "$t" >/dev/null || { echo "missing on this agent: $t" >&2; exit 1; }; done'
      # package.json runs .ts files with no flag: type stripping is on by
      # default only from Node 22.18.
      - 'node -e "const [a,b]=process.versions.node.split(\".\").map(Number); if (a<22||(a===22&&b<18)) { console.error(\"Node 22.18+ required, found \"+process.version); process.exit(1); }"'
      - 'python3 -m venv --help >/dev/null 2>&1 || { echo "python3 venv module missing on this agent" >&2; exit 1; }'
      - 'echo "node=$(node --version) npm=$(npm --version) $(python3 --version) $(make --version | head -1)"'

  - name: install
    image: bash
    environment:
      PLAYWRIGHT_BROWSERS_PATH: *browsers
    commands:
      - 'set -eu'
      - 'timeout -k 30 15m npm ci --no-audit --no-fund'
      # The CAV suites drive a real headless Chromium; npm ci does not fetch
      # the binary. No --with-deps: the hosts have no apt/sudo, so system
      # libraries must already be present. The browser cache path is not
      # commit-keyed; the download is version-locked by package-lock.json.
      - 'timeout -k 30 15m npx playwright install chromium'
      # test/unit/verifier.test.ts drives a real `make test` and a real
      # pytest suite, with no skip guard. PATH is NOT persisted between steps
      # (nor HOME), so the venv lives at a path derived from the pipeline
      # and the test steps re-export PATH. It must be OUTSIDE the checkout:
      # the runtime host snapshots the source tree and rejects symlinks
      # that escape it (.venv/bin/python3 -> /usr/bin/python3), which fails
      # runtime-host-isolation-reload. The number is per repo, so the repo
      # name is in the path, under the owned pe-venv- prefix (see the shared
      # guard in `variables`).
      - *venv_resolve
      # Delete only what is provably a venv of ours: an existing path with
      # the owned name but no regular-file pyvenv.cfg (a symlink does not
      # count) is not touched (refuse, exit 1).
      - 'if [ -e "$VENV" ]; then if [ -d "$VENV" ] && [ -f "$VENV/pyvenv.cfg" ] && [ ! -L "$VENV/pyvenv.cfg" ]; then rm -rf -- "$VENV"; else echo "refusing: $VENV exists and is not a venv" >&2; exit 1; fi; fi'
      - 'python3 -m venv "$VENV"'
      - '"$VENV/bin/pip" install -q pytest'
      - '"$VENV/bin/python" -m pytest --version'

  - name: roadmap-check
    image: bash
    environment:
      PLAYWRIGHT_BROWSERS_PATH: *browsers
    commands:
      - *venv_resolve
      - 'export PATH="$VENV/bin:$PATH"'
      # Exit 0 = every required milestone VERIFIED, evidence fresh, no
      # unresolved critical/high findings, dogfood evidence present.
      - 'timeout -k 30 60m npm run roadmap:check'

  # Always runs, pass or fail. Removes ONLY this pipeline's own venv (exact
  # path from the shared guard above). ACCEPTED LEAK: a pipeline killed or
  # cancelled before this step leaves one small venv (tens of MB) in
  # /tmp/woodpecker-cache until a human removes it. Leaking is chosen over
  # deleting by age or pattern: nothing in this repo's pipelines deletes
  # anything it did not create in the same run.
  - name: cleanup-venv
    image: bash
    when:
      - status: [success, failure]
    commands:
      - 'set -eu'
      - *venv_resolve
      # Only a real directory holding pyvenv.cfg is removed; anything else at
      # that path is left alone with a warning (exit 0: leaking over
      # deleting). A failed rm is deliberately NOT masked (no `|| true`):
      # a cleanup that cannot clean must be visible in the pipeline.
      - 'if [ -d "$VENV" ] && [ -f "$VENV/pyvenv.cfg" ] && [ ! -L "$VENV/pyvenv.cfg" ]; then rm -rf -- "$VENV"; echo "removed $VENV"; elif [ -e "$VENV" ]; then echo "warning: $VENV exists and is not a venv; leaving it (leaked)" >&2; else echo "no venv at $VENV"; fi'
